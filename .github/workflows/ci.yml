name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: macos-15
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Show toolchain
        run: xcodebuild -version && swift --version

      - name: Run tests
        run: swift test

      - name: Build application bundle
        env:
          VERSION: 1.0
          BUILD_NUMBER: ${{ github.run_number }}
        run: ./Scripts/build-app.sh

      - name: Upload application bundle
        uses: actions/upload-artifact@v4
        with:
          name: APOD-Wallpaper-${{ github.sha }}
          path: "build/APOD Wallpaper.app"
          if-no-files-found: error
